[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "universal-filament-manager"
version = "0.1.0.dev0"
description = "Manufacturer-neutral filament inventory and print accounting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.15,<2",
    "keyring>=25.6,<26",
    "paho-mqtt>=2.1,<3",
    "platformdirs>=4.3,<5",
    "pydantic>=2.10,<3",
    "segno>=1.6.6,<2",
    "sqlalchemy>=2.0.38,<3",
]

[project.optional-dependencies]
desktop = ["PySide6-Essentials>=6.8,<7"]
build = ["pyinstaller>=6.22,<7"]
dev = [
    "build>=1.2,<2",
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[project.scripts]
ufm = "ufm.bootstrap.cli:main"
ufm-desktop = "ufm.ui.desktop:main"
ufm-studio = "ufm.ui.studio:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ufm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: checks through real infrastructure boundaries",
    "contract: adapter contract checks",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unused_configs = true
